services:
  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./server
          target: /app/server

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://server:8000
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
