services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Server-side only: used by Next.js rewrites to reach the API container.
      # Never reaches the browser bundle.
      - INTERNAL_API_URL=http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
