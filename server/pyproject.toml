[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "openai==2.38.0",
    "anthropic==0.104.1",
    "groq==1.2.0",
    "python-dotenv==1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rule sets — aligned with Google Python Style Guide and clean code standards:
#   E/W  pycodestyle   — PEP 8 style errors and warnings
#   F    pyflakes      — undefined names, unused imports
#   I    isort         — import ordering
#   N    pep8-naming   — naming conventions
#   UP   pyupgrade     — keep syntax up to date with target Python version
#   B    bugbear       — common bugs and design issues
#   S    bandit        — security checks
#   C4   comprehensions — idiomatic list/dict/set comprehensions
#   RUF  ruff-specific — additional opinionated rules
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports in __init__ are intentional
"**/test_*.py" = ["S101"]   # assert is acceptable in test files

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# FastAPI decorators use complex generics; relax untyped decorator checks
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
