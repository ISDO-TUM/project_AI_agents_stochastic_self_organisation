[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=/opt/venv/bin/uvicorn api.index:app --host 127.0.0.1 --port 8000
directory=/app
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node /app/web/app/server.js
directory=/app/web
environment=NODE_ENV="production",PORT="7860",HOSTNAME="0.0.0.0",NEXT_TELEMETRY_DISABLED="1",INTERNAL_API_URL="http://localhost:8000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
