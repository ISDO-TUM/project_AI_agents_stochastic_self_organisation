name: Pull Request Checks

on: [pull_request]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|docs|refactor|test|ci|chore|perf)/[0-9]+-[a-z0-9-]+$"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH' does not follow the convention."
            echo "   Expected: <type>/<issue-number>-<short-description>"
            echo "   Example:  feat/42-sap-agent-streaming"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' is valid."

  quality:
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain setup ---
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # --- Install dependencies ---
      - name: Install Python dependencies
        run: cd api && uv venv && uv pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: pnpm install

      # --- Static analysis & formatting ---
      - name: Run pre-commit on all files
        run: cd api && uv run pre-commit run --all-files
