name: Quality Checks - Server

on:
  workflow_call:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install Python dependencies
        # `--locked` fails if uv.lock has drifted from pyproject.toml, so CI
        # catches lockfile drift before it can reach a deployment.
        run: cd server && uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Lint (pre-commit)
        run: cd server && uv run pre-commit run --all-files

      - name: Test (pytest)
        run: cd server && uv run pytest --cov=server --cov-report=term-missing
