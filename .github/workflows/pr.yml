name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new commit is pushed.
# This prevents stale runs from consuming CI minutes.
concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check naming convention
        run: |
          # Dependabot follows its own branch convention — exempt from this check.
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "✅ Dependabot branch — skipping name check."
            exit 0
          fi
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|docs|refactor|test|ci|chore|perf)/[0-9]+-[a-z0-9-]+$"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch '$BRANCH' does not match <type>/<issue-number>-<description>"
            echo "   Valid types: feat fix docs refactor test ci chore perf"
            echo "   Example: feat/42-agent-streaming"
            exit 1
          fi
          echo "✅ Branch name valid."

  quality-server:
    name: Quality — Server
    needs: branch-name
    uses: ./.github/workflows/_quality-server.yml

  quality-client:
    name: Quality — Client
    needs: branch-name
    uses: ./.github/workflows/_quality-client.yml
